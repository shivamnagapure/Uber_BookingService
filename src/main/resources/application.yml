#Problem : registering Entity Service , instead of Booking Service through yml file

server:
  port: ${PORT:8001}

spring:
  application:
    name: UberBookingService

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone:  ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: true


